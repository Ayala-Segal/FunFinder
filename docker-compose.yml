services:

  db:
    image: postgres:latest
    container_name: PostgreSQL_DB
    restart: always
    environment:
      POSTGRES_USER: Ayelet
      POSTGRES_PASSWORD: Ayelet1!
      POSTGRES_DB: dbnew
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d:z
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "psql -U Ayelet -d dbnew -c 'SELECT 1 FROM attractions LIMIT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadminApp
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  web:
    build: ./שלב ה
    container_name: FunFinder_Web
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME_SECRET: dbnew
      DB_USER_SECRET: Ayelet
      DB_PASSWORD_SECRET: Ayelet1!
      SECRET_KEY: exploreease-stage5-secret-2024
      ADMIN_EMAIL: admin@exploreease.com
      ADMIN_PASSWORD: Admin1234!
      ADMIN_NAME: Admin
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
