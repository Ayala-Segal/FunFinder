{% extends 'base.html' %}
{% block title %}Write a Review — ExploreEase{% endblock %}
{% block content %}
<div class="container my-4" style="max-width:540px;">
  <a href="{{ url_for('attractions.list_attractions') }}"
     class="text-muted small mb-3 d-inline-block">
    <i class="bi bi-arrow-left"></i> Back to Attractions
  </a>
  <div class="card shadow-sm border-0 rounded-4 p-4">
    <h4 class="fw-bold mb-4">{{ 'Edit Review' if review else 'Write a Review' }}</h4>
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">Attraction</label>
        <div class="position-relative">
          <input type="text" id="attractionSearch" class="form-control" autocomplete="off"
                 placeholder="Start typing an attraction name…">
          <input type="hidden" name="attraction_id" id="attractionId">
          <div id="attractionOptions" class="list-group position-absolute w-100 shadow"
               style="z-index:1050; max-height:220px; overflow-y:auto; display:none; top:100%;"></div>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Rating</label>
        <div class="d-flex gap-3">
          {% for val in [1,2,3,4,5] %}
          <div class="form-check">
            <input class="form-check-input" type="radio" name="rating"
                   id="r{{ val }}" value="{{ val }}"
                   {{ 'checked' if review and review.rating==val }}>
            <label class="form-check-label" for="r{{ val }}">
              <i class="bi bi-star-fill text-warning"></i> {{ val }}
            </label>
          </div>
          {% endfor %}
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Comment</label>
        <textarea name="comment" class="form-control" rows="4"
                  placeholder="Share your experience…">{{ review.comment if review else '' }}</textarea>
      </div>
      <button type="submit" class="btn btn-ee w-100 py-2">
        <i class="bi bi-send"></i> Submit Review
      </button>
    </form>
  </div>
</div>

<script>
const ATTRACTIONS = {{ attractions | tojson }};
const selectedAid = {{ (selected_aid or '') | tojson }};

const searchInput = document.getElementById('attractionSearch');
const idInput      = document.getElementById('attractionId');
const optionsBox   = document.getElementById('attractionOptions');

function renderOptions(list) {
  if (!list.length) { optionsBox.style.display = 'none'; optionsBox.innerHTML = ''; return; }
  optionsBox.innerHTML = list.slice(0, 20).map(a =>
    `<button type="button" class="list-group-item list-group-item-action" data-id="${a.attraction_id}">${a.name}</button>`
  ).join('');
  optionsBox.style.display = 'block';
}

searchInput.addEventListener('input', () => {
  idInput.value = '';
  const term = searchInput.value.trim().toLowerCase();
  renderOptions(term ? ATTRACTIONS.filter(a => a.name.toLowerCase().includes(term)) : ATTRACTIONS);
});

searchInput.addEventListener('focus', () => {
  renderOptions(searchInput.value.trim()
    ? ATTRACTIONS.filter(a => a.name.toLowerCase().includes(searchInput.value.trim().toLowerCase()))
    : ATTRACTIONS);
});

optionsBox.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-id]');
  if (!btn) return;
  idInput.value = btn.dataset.id;
  searchInput.value = btn.textContent;
  renderOptions([]);
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('#attractionSearch') && !e.target.closest('#attractionOptions')) {
    renderOptions([]);
  }
});

if (selectedAid) {
  const match = ATTRACTIONS.find(a => a.attraction_id === selectedAid);
  if (match) { searchInput.value = match.name; idInput.value = match.attraction_id; }
}

document.querySelector('form').addEventListener('submit', (e) => {
  if (!idInput.value) {
    e.preventDefault();
    alert('Please select an attraction from the list.');
  }
});
</script>
{% endblock %}
