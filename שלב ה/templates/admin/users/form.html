{% extends 'base.html' %}
{% block title %}{{ 'Edit' if user else 'Add' }} User — Admin{% endblock %}
{% block content %}
<div class="container my-4" style="max-width:540px;">
  <a href="{{ url_for('admin.users_list') }}" class="text-muted small mb-3 d-inline-block">
    <i class="bi bi-arrow-left"></i> Back to Users
  </a>
  <div class="card border-0 shadow-sm rounded-4 p-4">
    <h4 class="fw-bold mb-4">{{ 'Edit' if user else 'Add' }} User</h4>
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">Full Name</label>
        <input name="name" class="form-control" required
               value="{{ user.name if user else '' }}"/>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input name="email" type="email" class="form-control" required
               value="{{ user.email if user else '' }}"/>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Password{% if user %} (leave blank to keep current){% endif %}</label>
        <input name="password" type="password" class="form-control"
               {{ 'required' if not user }}/>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Phone</label>
        <input name="phone" class="form-control"
               value="{{ user.phone if user else '' }}"/>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Country</label>
        <input name="country" class="form-control"
               value="{{ user.country if user else '' }}"/>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-ee px-4">
          <i class="bi bi-check-lg"></i> Save
        </button>
        <a href="{{ url_for('admin.users_list') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
