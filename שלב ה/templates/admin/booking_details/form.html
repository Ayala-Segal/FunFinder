{% extends 'base.html' %}
{% block title %}{{ 'Edit' if detail else 'Add' }} Booking Detail — Admin{% endblock %}
{% block content %}
<div class="container my-4" style="max-width:540px;">
  <a href="{{ url_for('bookings.bd_list') }}" class="text-muted small mb-3 d-inline-block">
    <i class="bi bi-arrow-left"></i> Back to Booking Details
  </a>
  <div class="card border-0 shadow-sm rounded-4 p-4">
    <h4 class="fw-bold mb-4">{{ 'Edit' if detail else 'Add' }} Booking Detail</h4>
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">Booking</label>
        <select name="booking_id" class="form-select" required
                {{ 'disabled' if detail }}>
          {% for b in bookings %}
          <option value="{{ b.booking_id }}"
            {{ 'selected' if detail and detail.booking_id==b.booking_id }}>
            #{{ b.booking_id }} — {{ b.user_name }} ({{ b.booking_date }})
          </option>
          {% endfor %}
        </select>
        {% if detail %}
        <input type="hidden" name="booking_id" value="{{ detail.booking_id }}"/>
        {% endif %}
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Attraction</label>
        <select name="attraction_id" class="form-select" required
                {{ 'disabled' if detail }}>
          {% for a in attractions %}
          <option value="{{ a.attraction_id }}"
            {{ 'selected' if detail and detail.attraction_id==a.attraction_id }}>
            {{ a.name }}
          </option>
          {% endfor %}
        </select>
        {% if detail %}
        <input type="hidden" name="attraction_id" value="{{ detail.attraction_id }}"/>
        {% endif %}
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Quantity</label>
        <input name="quantity" type="number" min="1" class="form-control" required
               value="{{ detail.quantity if detail else '1' }}"/>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-ee px-4">
          <i class="bi bi-check-lg"></i> Save
        </button>
        <a href="{{ url_for('bookings.bd_list') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
