{% extends 'base.html' %}
{% block title %}{{ 'Edit' if attraction else 'Add' }} Attraction — Admin{% endblock %}
{% block content %}
<div class="container my-4" style="max-width:680px;">
  <a href="{{ url_for('attractions.admin_list') }}" class="text-muted small mb-3 d-inline-block">
    <i class="bi bi-arrow-left"></i> Back to Attractions
  </a>
  <div class="card border-0 shadow-sm rounded-4 p-4">
    <h4 class="fw-bold mb-4">{{ 'Edit' if attraction else 'Add' }} Attraction</h4>
    <form method="post">
      <div class="row g-3">
        <div class="col-md-8">
          <label class="form-label fw-semibold">Name</label>
          <input name="name" class="form-control" required
                 value="{{ attraction.name if attraction else '' }}"/>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Price ($)</label>
          <input name="price" type="number" step="0.01" class="form-control" required
                 value="{{ attraction.price if attraction else '' }}"/>
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Location</label>
          <input name="location" class="form-control" required
                 value="{{ attraction.location if attraction else '' }}"/>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Category</label>
          <select name="category_id" class="form-select" required>
            {% for c in categories %}
            <option value="{{ c.category_id }}"
              {{ 'selected' if attraction and attraction.category_id==c.category_id }}>
              {{ c.name }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Difficulty</label>
          <select name="difficulty_id" class="form-select" required>
            {% for d in difficulties %}
            <option value="{{ d.difficulty_id }}"
              {{ 'selected' if attraction and attraction.difficulty_id==d.difficulty_id }}>
              {{ d.name }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Duration (min)</label>
          <input name="duration" type="number" class="form-control"
                 value="{{ attraction.duration if attraction else '' }}"/>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Target Audience</label>
          <input name="target_audience" class="form-control"
                 value="{{ attraction.target_audience if attraction else '' }}"/>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Opening Hours</label>
          <input name="opening_hours" class="form-control"
                 value="{{ attraction.opening_hours if attraction else '' }}"/>
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Short Description</label>
          <textarea name="short_description" class="form-control" rows="2">{{ attraction.short_description if attraction else '' }}</textarea>
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Full Description</label>
          <textarea name="full_description" class="form-control" rows="4">{{ attraction.full_description if attraction else '' }}</textarea>
        </div>
      </div>
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-ee px-4">
          <i class="bi bi-check-lg"></i> Save
        </button>
        <a href="{{ url_for('attractions.admin_list') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
