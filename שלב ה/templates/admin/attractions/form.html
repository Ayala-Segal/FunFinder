{% extends 'base.html' %}
{% block title %}{{ 'Edit' if attraction else 'Add' }} Attraction — Admin{% endblock %}
{% block content %}
<div class="container my-4" style="max-width:680px;">
  <a href="{{ url_for('attractions.admin_list') }}" class="text-muted small mb-3 d-inline-block">
    <i class="bi bi-arrow-left"></i> Back to Attractions
  </a>
  <div class="card border-0 shadow-sm rounded-4 p-4">
    <h4 class="fw-bold mb-1">{{ 'Edit' if attraction else 'Add' }} Attraction</h4>
    <p class="text-muted small mb-4">Fields marked <span class="text-danger">*</span> are required</p>
    <form method="post">
      <div class="row g-3">

        <div class="col-md-8">
          <label class="form-label fw-semibold">Name <span class="text-danger">*</span></label>
          <input name="name" class="form-control" required
                 value="{{ attraction.name if attraction else '' }}"/>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-semibold">Price ($) <span class="text-danger">*</span></label>
          <input name="price" type="number" step="0.01" min="0" class="form-control" required
                 value="{{ attraction.price if attraction else '' }}"/>
        </div>

        <div class="col-12">
          <label class="form-label fw-semibold">Location <span class="text-danger">*</span></label>
          <input name="location" class="form-control" required
                 value="{{ attraction.location if attraction else '' }}"/>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
          <select name="category_id" class="form-select" required>
            {% for c in categories %}
            <option value="{{ c.category_id }}"
              {{ 'selected' if attraction and attraction.category_id==c.category_id }}>
              {{ c.name }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Difficulty <span class="text-danger">*</span></label>
          <select name="difficulty_id" class="form-select" required>
            {% for d in difficulties %}
            <option value="{{ d.difficulty_id }}"
              {{ 'selected' if attraction and attraction.difficulty_id==d.difficulty_id }}>
              {{ d.name }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Duration (minutes) <span class="text-danger">*</span></label>
          <input name="duration" type="number" min="1" class="form-control" required
                 value="{{ attraction.duration if attraction else '' }}"/>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Target Audience <span class="text-danger">*</span></label>
          <select name="target_audience" class="form-select" required>
            {% for opt in ['All', 'Families', 'Groups', 'Individuals'] %}
            <option value="{{ opt }}"
              {{ 'selected' if attraction and attraction.target_audience == opt }}>
              {{ opt }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-12">
          <label class="form-label fw-semibold">Short Description <span class="text-danger">*</span></label>
          <textarea name="short_description" class="form-control" rows="2" required>{{ attraction.short_description if attraction else '' }}</textarea>
        </div>

        <div class="col-12">
          <label class="form-label fw-semibold">
            Full Description
            <span class="text-muted fw-normal small">(optional)</span>
          </label>
          <textarea name="full_description" class="form-control" rows="4">{{ attraction.full_description if attraction else '' }}</textarea>
        </div>

        <div class="col-12">
          <label class="form-label fw-semibold">
            Main Image URL
            <span class="text-muted fw-normal small">(optional)</span>
          </label>
          <input name="main_image_url" class="form-control" placeholder="https://..."
                 value="{{ attraction.main_image_url if attraction else '' }}"/>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">
            Opening Hours
            <span class="text-muted fw-normal small">(optional)</span>
          </label>
          <input name="opening_hours" type="time" class="form-control"
                 value="{{ attraction.opening_hours if attraction else '' }}"/>
        </div>

      </div>
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-ee px-4">
          <i class="bi bi-check-lg"></i> Save
        </button>
        <a href="{{ url_for('attractions.admin_list') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
