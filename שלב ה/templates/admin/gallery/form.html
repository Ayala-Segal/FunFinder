{% extends 'base.html' %}
{% block title %}{{ 'Edit' if image else 'Add' }} Gallery Image — Admin{% endblock %}
{% block content %}
<div class="container my-4" style="max-width:520px;">
  <a href="{{ url_for('admin.gallery_list') }}" class="text-muted small mb-3 d-inline-block">
    <i class="bi bi-arrow-left"></i> Back to Gallery
  </a>
  <div class="card border-0 shadow-sm rounded-4 p-4">
    <h4 class="fw-bold mb-4">{{ 'Edit' if image else 'Add' }} Gallery Image</h4>
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">Attraction</label>
        <select name="attraction_id" class="form-select" required>
          {% for a in attractions %}
          <option value="{{ a.attraction_id }}"
            {{ 'selected' if image and image.attraction_id==a.attraction_id }}>
            {{ a.name }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Image URL</label>
        <input name="image_url" class="form-control" required
               value="{{ image.image_url if image else '' }}"/>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Caption</label>
        <input name="caption" class="form-control"
               value="{{ image.caption if image else '' }}"/>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-ee px-4"><i class="bi bi-check-lg"></i> Save</button>
        <a href="{{ url_for('admin.gallery_list') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
