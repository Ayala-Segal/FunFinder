{% extends 'base.html' %}
{% block title %}{{ 'Edit' if review else 'Add' }} Review — Admin{% endblock %}
{% block content %}
<div class="container my-4" style="max-width:540px;">
  <a href="{{ url_for('reviews.admin_list') }}" class="text-muted small mb-3 d-inline-block">
    <i class="bi bi-arrow-left"></i> Back to Reviews
  </a>
  <div class="card border-0 shadow-sm rounded-4 p-4">
    <h4 class="fw-bold mb-4">{{ 'Edit' if review else 'Add' }} Review</h4>
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">User</label>
        <select name="user_id" class="form-select" required>
          {% for u in users %}
          <option value="{{ u.user_id }}"
            {{ 'selected' if review and review.user_id==u.user_id }}>
            {{ u.name }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Attraction</label>
        <select name="attraction_id" class="form-select" required>
          {% for a in attractions %}
          <option value="{{ a.attraction_id }}"
            {{ 'selected' if review and review.attraction_id==a.attraction_id }}>
            {{ a.name }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Rating</label>
        <select name="rating" class="form-select" required>
          {% for v in [1,2,3,4,5] %}
          <option value="{{ v }}" {{ 'selected' if review and review.rating==v }}>{{ v }} Star(s)</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Comment</label>
        <textarea name="comment" class="form-control" rows="4">{{ review.comment if review else '' }}</textarea>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-ee px-4"><i class="bi bi-check-lg"></i> Save</button>
        <a href="{{ url_for('reviews.admin_list') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
