{% extends 'base.html' %}
{% block title %}{{ 'Edit' if category else 'Add' }} Category — Admin{% endblock %}
{% block content %}
<div class="container my-4" style="max-width:500px;">
  <a href="{{ url_for('admin.categories_list') }}" class="text-muted small mb-3 d-inline-block">
    <i class="bi bi-arrow-left"></i> Back to Categories
  </a>
  <div class="card border-0 shadow-sm rounded-4 p-4">
    <h4 class="fw-bold mb-4">{{ 'Edit' if category else 'Add' }} Category</h4>
    <form method="post">
      <div class="mb-4">
        <label class="form-label fw-semibold">Name</label>
        <input name="name" class="form-control" required
               value="{{ category.name if category else '' }}"/>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-ee px-4"><i class="bi bi-check-lg"></i> Save</button>
        <a href="{{ url_for('admin.categories_list') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
