{% extends 'base.html' %}
{% block title %}{{ 'Edit' if payment else 'Add' }} Payment — Admin{% endblock %}
{% block content %}
<div class="container my-4" style="max-width:520px;">
  <a href="{{ url_for('admin.payments_list') }}" class="text-muted small mb-3 d-inline-block">
    <i class="bi bi-arrow-left"></i> Back to Payments
  </a>
  <div class="card border-0 shadow-sm rounded-4 p-4">
    <h4 class="fw-bold mb-4">{{ 'Edit' if payment else 'Add' }} Payment</h4>
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">Booking</label>
        <select name="booking_id" class="form-select" required>
          {% for b in bookings %}
          <option value="{{ b.booking_id }}"
            {{ 'selected' if payment and payment.booking_id==b.booking_id }}>
            #{{ b.booking_id }} — {{ b.user_name }} ({{ b.booking_date }})
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Amount ($)</label>
        <input name="amount" type="number" step="0.01" class="form-control" required
               value="{{ payment.amount if payment else '' }}"/>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-ee px-4"><i class="bi bi-check-lg"></i> Save</button>
        <a href="{{ url_for('admin.payments_list') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
